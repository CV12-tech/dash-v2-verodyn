name: Gold-Signale

# Runs every gold setup (.claude/skills/trader-gold/signals.py) every 15
# minutes on weekdays and pushes new signals (08:00-20:00 German time) and
# their outcome (until 22:00) to ntfy. Needs the repository secret
# NTFY_TOPIC. Schedules only run from the default branch, and GitHub may
# start them a few minutes late.

on:
  schedule:
    - cron: "*/15 6-21 * * 1-5" # 06:00-21:45 UTC = 07/08-22/23 Uhr Berlin
  workflow_dispatch:

concurrency:
  group: gold-signals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore signal state
        uses: actions/cache/restore@v4
        with:
          path: trader/state
          key: gold-state-${{ github.run_id }}
          restore-keys: gold-state-

      - name: Scan and push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 .claude/skills/trader-gold/signals.py notify

      - name: Save signal state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: trader/state
          key: gold-state-${{ github.run_id }}
